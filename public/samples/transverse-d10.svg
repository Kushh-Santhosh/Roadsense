<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="roadSurfaceD10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Asphalt Road Carriageway Base -->
  <rect width="600" height="400" fill="url(#roadSurfaceD10)" />

  <!-- Road Granule details -->
  <g opacity="0.3">
    <circle cx="120" cy="80" r="2" fill="#cbd5e1"/>
    <circle cx="280" cy="60" r="1.5" fill="#f8fafc"/>
    <circle cx="460" cy="90" r="2.5" fill="#94a3b8"/>
    <circle cx="150" cy="320" r="1.5" fill="#cbd5e1"/>
    <circle cx="380" cy="340" r="2" fill="#f8fafc"/>
    <circle cx="510" cy="310" r="2" fill="#94a3b8"/>
  </g>

  <!-- Solid White Shoulder Line -->
  <line x1="50" y1="0" x2="50" y2="400" stroke="#f8fafc" stroke-width="6" opacity="0.5" />

  <!-- Broken White Divider Line -->
  <line x1="550" y1="20" x2="550" y2="120" stroke="#f8fafc" stroke-width="8" opacity="0.6" />
  <line x1="550" y1="180" x2="550" y2="280" stroke="#f8fafc" stroke-width="8" opacity="0.6" />
  <line x1="550" y1="340" x2="550" y2="400" stroke="#f8fafc" stroke-width="8" opacity="0.6" />

  <!-- D10 Transverse Thermal Crack (Perpendicular fracture extending across carriageway) -->
  <g stroke="#020617" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M40 210 L100 205 L160 218 L230 208 L310 222 L380 212 L450 220 L520 215 L580 225" stroke-width="4.5" />
    <path d="M40 210 L100 205 L160 218 L230 208 L310 222 L380 212 L450 220 L520 215 L580 225" stroke="#0f172a" stroke-width="2.5" />

    <!-- Secondary perpendicular fracture tendrils -->
    <path d="M160 218 L175 195 M230 208 L220 235 M310 222 L330 245 M380 212 L395 190 M450 220 L440 240" stroke-width="2" />
    <path d="M100 205 L115 185 M520 215 L535 235" stroke-width="1.8" />
  </g>

  <!-- Slight Bitumen Bleeding / Sealant along crack line -->
  <path d="M80 208 C150 212, 280 210, 480 218" stroke="#090d16" stroke-width="8" opacity="0.25" stroke-linecap="round" />

  <!-- Aggregate fragments along transverse fissure -->
  <circle cx="162" cy="217" r="3" fill="#64748b" />
  <circle cx="232" cy="207" r="3.5" fill="#475569" />
  <circle cx="312" cy="221" r="4" fill="#334155" />
  <circle cx="382" cy="211" r="3" fill="#64748b" />
  <circle cx="452" cy="219" r="3.5" fill="#475569" />

  <!-- Class Identification Badge -->
  <rect x="20" y="20" width="190" height="32" rx="8" fill="#142536" opacity="0.9" />
  <text x="32" y="41" fill="#f28c28" font-family="sans-serif" font-size="13" font-weight="bold">RDD2022 • D10 TRANSVERSE</text>
</svg>
