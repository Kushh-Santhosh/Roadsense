<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="roadSurfaceD20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <!-- Asphalt Road Carriageway Base -->
  <rect width="600" height="400" fill="url(#roadSurfaceD20)" />

  <!-- Road Granule details -->
  <g opacity="0.3">
    <circle cx="100" cy="80" r="1.5" fill="#e2e8f0"/>
    <circle cx="250" cy="50" r="2" fill="#94a3b8"/>
    <circle cx="480" cy="110" r="2.5" fill="#cbd5e1"/>
    <circle cx="120" cy="340" r="1.5" fill="#94a3b8"/>
    <circle cx="420" cy="330" r="2" fill="#e2e8f0"/>
  </g>

  <!-- White Edge Line (Faded) -->
  <line x1="0" y1="360" x2="600" y2="360" stroke="#f8fafc" stroke-width="8" opacity="0.5" stroke-dasharray="16 10" />

  <!-- D20 Fatigue Alligator Cracking Network (Interconnected Polygon Cell Grid) -->
  <g stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Primary Mesh Spine -->
    <path d="M150 180 L200 150 L260 160 L320 130 L380 150 L440 135 L500 160" />
    <path d="M140 220 L195 205 L250 225 L310 195 L375 215 L435 190 L490 220" />
    <path d="M160 270 L210 255 L270 275 L330 250 L390 265 L450 245 L485 270" />

    <!-- Cross Interconnecting Struts (Polygon Cells) -->
    <path d="M200 150 L195 205 L210 255" />
    <path d="M260 160 L250 225 L270 275" />
    <path d="M320 130 L310 195 L330 250" />
    <path d="M380 150 L375 215 L390 265" />
    <path d="M440 135 L435 190 L450 245" />

    <!-- Secondary Micro-fractures within cells -->
    <path d="M200 150 L230 185 L250 225" stroke-width="2.5" />
    <path d="M260 160 L285 190 L310 195" stroke-width="2" />
    <path d="M320 130 L350 170 L375 215" stroke-width="2.5" />
    <path d="M380 150 L410 180 L435 190" stroke-width="2" />
    <path d="M195 205 L235 240 L270 275" stroke-width="2" />
    <path d="M310 195 L355 230 L390 265" stroke-width="2.2" />
    <path d="M375 215 L415 235 L450 245" stroke-width="2" />

    <!-- Radial stress cracks escaping outward -->
    <path d="M150 180 L110 160" stroke-width="2" />
    <path d="M140 220 L95 235" stroke-width="2.5" />
    <path d="M160 270 L120 295" stroke-width="2" />
    <path d="M500 160 L540 145" stroke-width="2" />
    <path d="M490 220 L535 230" stroke-width="2.5" />
    <path d="M485 270 L525 290" stroke-width="2" />
  </g>

  <!-- Slight Depression Shading along fatigue area -->
  <ellipse cx="320" cy="210" rx="180" ry="70" fill="#000000" opacity="0.12" />

  <!-- Class Identification Badge -->
  <rect x="20" y="20" width="190" height="32" rx="8" fill="#142536" opacity="0.9" />
  <text x="32" y="41" fill="#f28c28" font-family="sans-serif" font-size="13" font-weight="bold">RDD2022 • D20 ALLIGATOR</text>
</svg>

