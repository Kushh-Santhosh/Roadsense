<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="roadSurfaceD00" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Asphalt Road Lane Base -->
  <rect width="600" height="400" fill="url(#roadSurfaceD00)" />

  <!-- Road Granule details -->
  <g opacity="0.25">
    <circle cx="80" cy="50" r="1.5" fill="#f8fafc"/>
    <circle cx="210" cy="90" r="2" fill="#cbd5e1"/>
    <circle cx="390" cy="40" r="2.5" fill="#94a3b8"/>
    <circle cx="520" cy="80" r="1.5" fill="#f8fafc"/>
    <circle cx="150" cy="350" r="2" fill="#94a3b8"/>
    <circle cx="450" cy="320" r="2.5" fill="#cbd5e1"/>
  </g>

  <!-- Center White Dashed Lane Line -->
  <rect x="520" y="20" width="12" height="90" fill="#f8fafc" opacity="0.6" rx="2" />
  <rect x="520" y="160" width="12" height="90" fill="#f8fafc" opacity="0.6" rx="2" />
  <rect x="520" y="300" width="12" height="90" fill="#f8fafc" opacity="0.6" rx="2" />

  <!-- Wheelpath Depression Shadow running vertically along lane -->
  <rect x="230" y="0" width="140" height="400" fill="#000000" opacity="0.15" />

  <!-- D00 Longitudinal Crack (Continuous jagged fracture running along vehicle travel direction) -->
  <g stroke="#020617" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M295 0 L300 45 L292 90 L305 140 L298 185 L310 235 L302 285 L315 340 L308 400" stroke-width="4.5" />
    <path d="M295 0 L300 45 L292 90 L305 140 L298 185 L310 235 L302 285 L315 340 L308 400" stroke="#0f172a" stroke-width="2.5" />

    <!-- Secondary branch fissures -->
    <path d="M292 90 L275 110 M305 140 L325 155 M298 185 L280 205 M310 235 L335 250 M302 285 L285 310" stroke-width="2" />
    <path d="M300 45 L318 60 M315 340 L330 365 M280 205 L270 220" stroke-width="1.8" />
  </g>

  <!-- Spalled aggregate chips along the crack edges -->
  <circle cx="294" cy="95" r="3" fill="#64748b" />
  <circle cx="307" cy="142" r="3.5" fill="#475569" />
  <circle cx="300" cy="188" r="4" fill="#334155" />
  <circle cx="312" cy="238" r="3" fill="#64748b" />
  <circle cx="304" cy="288" r="3.5" fill="#475569" />

  <!-- Class Identification Badge -->
  <rect x="20" y="20" width="205" height="32" rx="8" fill="#142536" opacity="0.9" />
  <text x="32" y="41" fill="#f28c28" font-family="sans-serif" font-size="13" font-weight="bold">RDD2022 • D00 LONGITUDINAL</text>
</svg>

